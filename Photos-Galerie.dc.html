body{margin:0}
.gal2{position:relative;background:var(--paper);color:#17110f;padding:46px 56px 90px;box-shadow:var(--lift),10px 12px 0 var(--hard)}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:20px;flex-wrap:wrap;border-bottom:2px solid #17110f;padding-bottom:14px}
.top h1{margin:0;font:400 64px/1 'Permanent Marker',cursive;color:var(--title)}
.top nav{display:flex;gap:26px;flex-wrap:wrap;font:16px 'Share Tech Mono',monospace;letter-spacing:.14em;text-transform:uppercase}

.hintg{margin:18px 0 0;font:700 26px/1 Caveat,cursive;color:var(--navy);text-align:right}
.mos{display:flex;gap:40px;margin-top:40px;align-items:flex-start}.mc{flex:1;min-width:0;display:flex;flex-direction:column;gap:34px}.mc.off{margin-top:110px}
.sh3{display:flex;align-items:baseline;gap:18px;margin-bottom:44px}
.sh3 .sn{font:18px 'Share Tech Mono',monospace;color:var(--red);letter-spacing:.14em}
.sh3 h3{margin:0;font:400 44px/1 'Permanent Marker',cursive;color:#17110f}
.rw{display:flex;gap:36px;margin-bottom:70px}
.gp{margin:0;min-width:0;transition:transform .2s}.gp:hover{transform:translateY(-3px)}
.ph{display:grid;place-items:center;background:#ece3cf;border:2px dashed #c4b794;box-sizing:border-box;width:100%}
.ph i{font:15px/1.4 'Share Tech Mono',monospace;letter-spacing:.2em;text-transform:uppercase;color:#a09474;text-align:center}
.gp img{display:block;width:100%;height:auto}

.gp.has{cursor:zoom-in}
.gv{display:none;position:fixed;inset:0;z-index:100;overscroll-behavior:contain;background:rgba(40,16,8,.82);align-items:center;justify-content:center;padding:3vh 3vw;box-sizing:border-box}

.gvx{font:22px 'Share Tech Mono',monospace;background:var(--yel);color:var(--ink);border:0;padding:6px 16px;box-shadow:3px 4px 0 var(--hard);cursor:pointer;transform:rotate(1.5deg)}
.gvs{display:flex;align-items:center;gap:18px}
.gvi{flex:1;min-width:0;height:var(--sh,520px);display:grid;place-items:center}
.gvi img{max-width:100%;max-height:var(--sh,520px);width:auto;height:auto;display:block;box-shadow:0 12px 40px rgba(0,0,0,.65)}
.gvn{flex:0 0 64px;width:64px;height:64px;border:0;background:var(--paper);color:var(--title);font:40px/1 'Permanent Marker',cursive;box-shadow:3px 4px 0 var(--hard);cursor:pointer;padding:0 0 6px}
.gvn:hover{background:var(--yel)}
@media (max-width:900px){.mos{flex-direction:column}.mc.off{margin-top:0}.gal2{padding:30px 20px 60px}.rw{flex-wrap:wrap}.gp{width:100%!important;margin-top:0!important}.top h1{font-size:44px}.gvn{flex-basis:44px;width:44px;height:44px;font-size:28px}}

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":9900}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
componentDidMount() {
const $ = (id) => document.getElementById(id);
const gv = $('gv'), im = $('gv-i'), cap = $('gv-c');
if (!gv || !im) return;
const items = () => Array.prototype.slice.call(document.querySelectorAll('.gp.has'));
let cur = 0, open = false;
const show = (i) => {
const L = items(); if (!L.length) return;
cur = (i + L.length) % L.length;
const el = L[cur];
const thumb = el.querySelector('img').getAttribute('src'), full = el.getAttribute('data-full') || thumb;
im.src = thumb;
const pre = new Image();
pre.onload = () => { if (L[cur] === el && im.getAttribute('src') === thumb) im.src = full; };
pre.src = full;
[1, -1].forEach((d) => { const n = L[(cur + d + L.length) % L.length]; if (n) { const p = new Image(); p.src = n.getAttribute('data-full'); } });
im.alt = el.querySelector('img').getAttribute('alt') || '';
const c = el.querySelector('figcaption');
cap.textContent = (cur + 1) + ' / ' + L.length;
};
const openAt = (i) => {
open = true; show(i);
const sh = Math.max(380, Math.min(680, (window.screen && window.screen.availHeight ? window.screen.availHeight : 900) - 300));
$('gvin').style.setProperty('--sh', sh + 'px');
gv.style.display = 'flex';
[60, 300].forEach((t) => setTimeout(() => { try { const w = $('gvin'); if (w && open) w.scrollIntoView({ block: 'center', inline: 'center' }); } catch (x) {} }, t));
};
const close = () => {
if (!open) return;
open = false; gv.style.display = 'none';
try { const L = items(); if (L[cur]) L[cur].scrollIntoView({ block: 'center' }); } catch (e) {}
};
this.cClick = (e) => {
const t = e.target;
if (!t || !t.closest) return;
if (t.closest('#gv-x')) { close(); return; }
if (t.closest('#gv-p')) { show(cur - 1); return; }
if (t.closest('#gv-nx')) { show(cur + 1); return; }
if (t === gv) { close(); return; }
if (t.closest('#gv')) return;
const el = t.closest('.gp.has');
if (el) openAt(items().indexOf(el));
};
this.cKey = (e) => {
if (!open) return;
if (e.key === 'ArrowLeft') { show(cur - 1); e.preventDefault(); }
else if (e.key === 'ArrowRight') { show(cur + 1); e.preventDefault(); }
else if (e.key === 'Escape') { close(); }
};
this.cWheel = (e) => {
if (!open || !e.target.closest || !e.target.closest('#gv')) return;
e.preventDefault();
const now = Date.now();
if (now - (this.lastW || 0) < 380) return;
this.lastW = now;
show(cur + (e.deltaY > 0 ? 1 : -1));
};
const warm = items().map((e) => e.getAttribute('data-full'));
warm.forEach((u, k) => setTimeout(() => { const p = new Image(); p.src = u; }, 1500 + k * 400));
document.addEventListener('wheel', this.cWheel, { passive: false });
document.addEventListener('click', this.cClick);
document.addEventListener('keydown', this.cKey);
}
componentWillUnmount() {
if (this.cClick) document.removeEventListener('click', this.cClick);
if (this.cKey) document.removeEventListener('keydown', this.cKey);
if (this.cWheel) document.removeEventListener('wheel', this.cWheel);
}
}
</script>
